name: Relatar um erro
description: Informe um problema reproduzível no Sussurro
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Antes de enviar, remova dos logs qualquer transcrição, nome, caminho de usuário ou outro dado pessoal.

  - type: input
    id: version
    attributes:
      label: Versão do Sussurro
      description: Consulte a tela Sobre ou informe o commit usado.
      placeholder: v0.1.1
    validations:
      required: true

  - type: dropdown
    id: variant
    attributes:
      label: Variante
      options:
        - CPU
        - CUDA
        - Código-fonte
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Versão do Windows
      placeholder: Windows 11 24H2
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Obrigatório para a variante CUDA.
      placeholder: NVIDIA GeForce RTX 3060, driver 560.94

  - type: textarea
    id: reproduce
    attributes:
      label: Como reproduzir
      description: Liste os passos mínimos, começando com o aplicativo fechado.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: O que deveria acontecer
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: O que aconteceu
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log relevante
      description: Cole somente o trecho próximo ao erro e remova dados pessoais.
      render: shell

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Removi transcrições e dados pessoais das informações acima.
          required: true
