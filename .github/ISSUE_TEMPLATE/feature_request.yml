name: Sugerir uma melhoria
description: Proponha um recurso novo ou uma mudança no Sussurro
title: "[Sugestão] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve?
      description: Descreva a situação em que o Sussurro não atende hoje.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Como você imagina a solução?
      description: Comportamento esperado, telas ou comandos envolvidos.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Outras formas de resolver ou contornar o problema.
