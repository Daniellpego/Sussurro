name: Release
run-name: Build and Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check version and extract release notes
        shell: pwsh
        run: python scripts/release_notes.py "${{ github.ref_name }}" --out installer/out/RELEASE_NOTES.md

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-gpu.txt -r requirements-dev.txt

      - name: Check code and tests
        shell: pwsh
        run: |
          ruff check sussurro scripts tests
          python scripts/validate_all.py

      - name: Build Standalone Bundle (CPU Variant)
        shell: pwsh
        run: |
          $env:SUSSURRO_VARIANT = "cpu"
          $version = "${{ github.ref_name }}".TrimStart('v')
          pyinstaller --noconfirm sussurro.spec
          ISCC.exe /DMyAppVersion="$version" /DAppVariant="CPU" installer/sussurro.iss

      - name: Build Standalone Bundle (CUDA Variant)
        shell: pwsh
        run: |
          $env:SUSSURRO_VARIANT = "cuda"
          $version = "${{ github.ref_name }}".TrimStart('v')
          pyinstaller --noconfirm sussurro.spec
          ISCC.exe /DMyAppVersion="$version" /DAppVariant="CUDA" installer/sussurro.iss

      - name: Generate Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/out
          Get-FileHash -Algorithm SHA256 installer/out/*.exe | ForEach-Object {
              "$($_.Hash)  $([System.IO.Path]::GetFileName($_.Path))"
          } | Out-File -FilePath installer/out/checksums-sha256.txt -Encoding utf8
          Get-Content installer/out/checksums-sha256.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/out/SussurroSetup-CPU.exe
            installer/out/SussurroSetup-CUDA.exe
            installer/out/checksums-sha256.txt
          body_path: installer/out/RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
