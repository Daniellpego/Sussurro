<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc">
  <title id="title">From your voice to text, on your computer</title>
  <desc id="desc">Illustrative flow with local models: microphone, transcription, and text at the cursor. Optional rewriting uses a local Ollama model.</desc>
  <defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9d7aff"/><stop offset="1" stop-color="#ec57b8"/></linearGradient></defs>
  <rect width="1200" height="250" rx="24" fill="#101116"/>
  <g fill="#18191f" stroke="#34313f"><rect x="28" y="28" width="340" height="194" rx="18"/><rect x="430" y="28" width="340" height="194" rx="18"/><rect x="832" y="28" width="340" height="194" rx="18"/></g>
  <g fill="url(#brand)"><rect x="59" y="61" width="8" height="23" rx="4"/><rect x="75" y="49" width="8" height="47" rx="4"/><rect x="91" y="57" width="8" height="31" rx="4"/></g>
  <g font-family="Segoe UI,Arial,sans-serif" fill="#f3efff">
    <text x="59" y="144" font-size="29" font-weight="600">Your voice</text><text x="59" y="179" font-size="20" fill="#bdb4d0">Hold the hotkey and speak.</text>
    <text x="461" y="85" font-size="21" fill="#c5aaff">02 / ON YOUR PC</text><text x="461" y="144" font-size="29" font-weight="600">Local transcription</text><text x="461" y="179" font-size="20" fill="#bdb4d0">Optional AI with a local model.</text>
    <text x="863" y="85" font-size="21" fill="#c5aaff">03 / IN YOUR FLOW</text><text x="863" y="144" font-size="29" font-weight="600">Text at the cursor</text><text x="863" y="179" font-size="20" fill="#bdb4d0">Release and keep writing.</text>
  </g>
  <g fill="none" stroke="#b18cea" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M389 125h22m-8-8 8 8-8 8"/><path d="M791 125h22m-8-8 8 8-8 8"/></g>
</svg>
