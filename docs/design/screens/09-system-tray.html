<style>body {
    background-color: transparent;

    /* Simulated desktop background for demo purposes */

    background-size: cover;
    background-position: center
    }
.menu-surface {
    background-color: #14171D;
    backdrop-filter: blur(12px)
    }
.custom-checkbox {
    position: relative;
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease
    }
.custom-checkbox.checked {
    background: linear-gradient(135deg, #8083ff 0%, #ffb0cd 100%);
    border: none
    }
.custom-checkbox .material-symbols-outlined {
    font-size: 14px;
    color: transparent;
    font-variation-settings: "FILL" 1, "wght" 600
    }
.custom-checkbox.checked .material-symbols-outlined {
    color: white
    }
.menu-item {
    position: relative
    }
.menu-item::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 4px;
    background: linear-gradient(135deg, rgba(128, 131, 255, 0.1) 0%, rgba(255, 176, 205, 0.1) 100%);
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none
    }
.menu-item:hover::before {
    opacity: 1
    }
.tray-icon-container {
    background-color: #14171D;
    border-radius: 6px
    }</style>

<!-- Item: Abrir Sussurro (Bold) -->
<button class="menu-item flex items-center px-3 py-2 rounded-item w-full text-left font-label-md text-label-md font-bold hover:text-primary transition-colors cursor-default">
                Abrir Sussurro
            </button>
<!-- Divider -->
<div class="h-px bg-outline-variant/20 my-1 mx-2"></div>
<!-- Item: Pausar transcrição (with custom checkbox) -->
<button class="menu-item flex items-center justify-between px-3 py-2 rounded-item w-full text-left font-body-sm text-body-sm hover:text-primary transition-colors cursor-default group" onclick="toggleCheckbox(this)">
<span>Pausar transcrição</span>
<!-- Custom Checkbox (Checked state as requested in prompt implicitly for 'Pausar transcrição' with custom gradient checkmark) -->
<div class="custom-checkbox checked shadow-sm">
<span class="material-symbols-outlined">check</span>
</div>
</button>
<!-- Divider -->
<div class="h-px bg-outline-variant/20 my-1 mx-2"></div>
<!-- Item: Sair -->
<button class="menu-item flex items-center px-3 py-2 rounded-item w-full text-left font-body-sm text-body-sm hover:text-error transition-colors cursor-default">
                Sair
            </button>
</div>
