[project]
name = "sussurro"
version = "0.1.0"
description = "Ditado por voz local para Windows com faster-whisper e LLM local opcional."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E702", "E402", "E741"]
